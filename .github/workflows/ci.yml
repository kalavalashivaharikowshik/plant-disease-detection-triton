name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest -q

  frontend:
    name: Frontend (lint + types + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - name: all-in-one (Render)
            file: Dockerfile
          - name: backend
            file: backend/Dockerfile
          - name: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: ${{ matrix.file == 'Dockerfile' }}
          tags: leafscan:ci
          cache-from: type=gha,scope=${{ matrix.file }}
          cache-to: type=gha,mode=max,scope=${{ matrix.file }}
      - name: Smoke-test the all-in-one image
        if: matrix.file == 'Dockerfile'
        run: |
          docker run -d --name app -p 8000:8000 --memory=512m leafscan:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && break; sleep 2; done
          curl -fsS http://localhost:8000/api/ready
          curl -fsS http://localhost:8000/ | grep -q "<div id=\"root\">"
          curl -fsS -F image=@backend/tests/fixtures/apple_black_rot.jpg http://localhost:8000/api/predict \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['prediction']['class_id']=='Apple___Black_rot', d['prediction']; print('predict OK', d['prediction']['confidence'])"
          docker stats --no-stream app
          docker logs app | tail -20
